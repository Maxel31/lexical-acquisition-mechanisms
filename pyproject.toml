[project]
name = "lexical-acquisition-mechanisms"
version = "0.1.0"
description = "言語モデルにおける語彙獲得と語義追加の機構解析（OLMo 2 の継続事前学習による実験）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5",
    "torch>=2.14",
    "transformers>=5.20",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lam"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
