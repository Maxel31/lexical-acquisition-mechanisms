# 実験の設定。各コマンドは、リポジトリの最上位のディレクトリにあるこのファイルを読む。

# --model で指定する名前と、Hugging Face のリポジトリ・版（コミット）。
# 版は、事前学習のステージ1の最後の重み（継続事前学習の学習率と学習データを、ステージ1に合わせるため）。
# コメントは、そのコミットを指すブランチの名前
models:
  # （試行は 1B だけ。7B・13B は本番で使う）
  OLMo-2-0425-1B:
    repository: allenai/OLMo-2-0425-1B
    revision: 9d3e43659f00c17e6da23cf32333afd1fc39fa1a  # stage1-step1907359-tokens4001B

# 語の候補の生成や用例の判定に使う LLM（README のとおりに起動した vLLM のサーバ）
llm:
  server_url: http://localhost:8000/v1
  model: Qwen/Qwen3-Next-80B-A3B-Instruct-FP8
  # 同時に送る問いの数（128 では、サーバの KV キャッシュを 7% ほどしか使わず、同時に処理する数で
  # 速さが決まっていた。サーバを2つ並べたとき（README）にも、1つあたり約512件になるようにする。
  # サーバが1つなら、超えた分はサーバの中で待つ。答えは変わらない）
  maximum_concurrent_requests: 1024

# 基データ（OLMo 2 の事前学習データの、学習順で先頭の部分）と検証データ
base_data:
  # OLMo 2 7B のステージ1の学習設定（版を固定した URL）。3モデルとも、学習データの一覧と seed は同じ
  pretraining_configuration_url: https://raw.githubusercontent.com/allenai/OLMo/090253dac6688f2532509daa7aa2eb5fae50e956/configs/official-1124/OLMo2-7B-stage1.yaml
  # 学習順の先頭から取る系列（4,096トークン）の数。7B の事前学習の最初の72 step 分（約3億トークン）
  number_of_base_sequences: 73728
  # その直後から取る、検証データの系列の数（約1,000万トークン）
  number_of_validation_sequences: 2442

# 語の選定
words:
  # 名詞のカテゴリ。name は課題2の選択肢の語にもなる（先頭スペース付きで1トークンの語）。
  # wordnet_roots の synset の下にある語義を、そのカテゴリの語義とする
  categories:
    - name: food
      description: foods and dishes that people eat
      wordnet_roots: [food.n.01, food.n.02]
    - name: animal
      description: animals
      wordnet_roots: [animal.n.01]
    - name: vehicle
      description: vehicles that carry people or goods
      wordnet_roots: [vehicle.n.01]
    - name: clothing
      description: clothing and footwear worn on the body
      wordnet_roots: [clothing.n.01, footwear.n.02]
    - name: furniture
      description: furniture and home furnishings
      wordnet_roots: [furnishing.n.02]
    - name: building
      description: buildings
      wordnet_roots: [building.n.01]
  # LLM に語を挙げさせるときの、挙げる語の種類と頭文字の組（種類 × 頭文字の組ごとに1回）と、
  # 1回に挙げさせる数（一度に多く挙げさせると、温度0では同じ語の繰り返しに入り、長さの上限で
  # 切れるので、頭文字で分けて少しずつ挙げさせる）
  listing_kinds:
    - very common, everyday
    - less common but well-known
  listing_letter_groups:
    - a, b
    - c
    - d, e, f
    - g, h, i, j, k
    - l, m, n, o
    - p, q, r
    - s
    - t, u, v, w, x, y, z
  nouns_per_listing: 25
  adjectives_per_listing: 50
  # 頻度と使われ方を見積もるときに読む、Pile の先頭の断片の数（全1,650個のうち約3%）
  pile_sample_shards: 50
  # 使われ方を LLM が判定する、語ごとの見本の数
  usage_examples_per_word: 50
  seed: 0

# 未知語（モデルが見たことのない文字列）の候補
unknown_words:
  # 一度も現れないことを確かめる infini-gram の索引（OLMo 2 13B の中間学習・事後学習までの学習データと、Pile）
  corpus_indexes:
    - v4_olmo-2-1124-13b-instruct_llama
    - v4_piletrain_llama
  # ARC 非語データベースの、同音の実在語がない非語（Rastle et al., 2002。figshare で公開）
  arc_nonwords_url: https://ndownloader.figshare.com/files/13877978
  # トークン数（2・3）と綴りの近さ（near・far）の組ごとに集める、一度も現れない候補の数
  # （使うのは各12個。最初のトークンが重ならないように選ぶための余裕を持たせる）
  candidates_per_group: 40

# 候補から語を選ぶときの条件（words select）
word_selection:
  # Pile の見本で、名詞72語・ターゲット語が意図した語義で使われていた割合の下限。同じ語義の比喩・
  # 慣用句・複合名詞の一部も含めた割合（別の語義・名前・名詞でない使い方が20%までの語を「ほぼ単義」と
  # する。apple・mouse のように別の語義や名前の使い方が強い語は、これよりずっと低い）。
  # 語義を厳しく判定するようにした後、家具の名詞が足りないので、0.85 から下げた
  # （用例は、語義を厳しく判定して選ぶ）
  minimum_usage_share: 0.80
  # 名詞72語だけ、カテゴリごとに minimum_usage_share の代わりに使う下限。家具は、用例の確認で精度が
  # 届かない rug・throne・desk と、Pile の見本で精度が届かない見込みの lounge・bench を外すと、
  # 1トークンで使える語が、名詞12語と1トークンのターゲット語に足りない。家具の意味が 0.44 の
  # cabinet（ほかは内閣の意味。判定に通った見本は全て家具）まで使う
  minimum_noun_usage_share_by_category:
    furniture: 0.44
  # 形容詞72語が、Pile の見本で形容詞として使われていた割合の下限（「ほとんど形容詞としてだけ
  # 使われる語」。名詞の下限を下げたときも、0.85 のままにする）
  minimum_adjective_usage_share: 0.85
  # 自然な語（実験で操作しない語。課題の例やプローブの学習に使う）の、その割合の下限。設計書は自然な
  # 語に単義を求めておらず、その用例も語義の判定に通すので、意図した語義が主な使い方であればよい。
  # 語義を厳しく判定するようにした後、家具の自然な名詞が30語に足りない（0.6 で29語）ので、0.6 から
  # 下げた
  minimum_natural_word_usage_share: 0.55
  # その割合を当てにできるように、LLM が判定できた見本の数の下限
  minimum_judged_usages: 20
  # Pile で取れる用例の見積もりに、用例として使える使われ方（名詞は意図した語義で字義どおり、形容詞は
  # 形容詞として）の割合を掛けた数が、必要な数の何倍以上か
  # （ほぼ同じ用例の除去と、ほかの管理対象の語を含む用例の除外で減る分を見込む）
  passage_margin: 2.0
  # 形容詞72語の、どのカテゴリとの結びつきの評定（1〜7）も、これ以下にする
  maximum_category_association: 3
  # 名詞72語の中で、互いに同義語の名詞を選んでよいカテゴリ。家具は、1トークンで用例が十分に取れる
  # ほぼ単義の名詞が、同義語（couch と sofa、carpet と rug）を除くと12語に足りない
  # （ターゲット語は、どのカテゴリでも名詞72語の同義語にしない）
  categories_allowing_synonyms: [furniture]
  # 自然な名詞（設計書は各カテゴリ30語）の候補が30語に足りないカテゴリで、選んでよい最も少ない数。
  # 家具は、条件を満たす候補が29語（語義の判定が説明と合わない box を外した後）
  minimum_natural_nouns_per_category: 25
  # 用例か文が足りない自然な語は、外して続ける（設計書は自然な語に数だけを決めているので）。そのとき、
  # 自然な名詞はカテゴリごとに minimum_natural_nouns_per_category 語、自然な形容詞はこの数を残す
  # （下回るときは止まる）
  minimum_natural_adjectives: 50

# 用例（管理対象の語を含む、Pile から切り出した文章）
passages:
  # 用例の長さ（トークン数）
  tokens_per_passage: 256
  # 1つの文書から取る用例の数の上限
  maximum_passages_per_document: 3
  # 語ごとの評価用の用例の数
  evaluation_passages_per_word: 500
  # 判定に合格する見込みの候補の数の、合格する必要がある数に対する倍率（見本の割合 usage_share の
  # 誤差などの余裕）。切り出しで残す出現の数は、必要な数 × この倍率 × occurrence_margin ÷ usage_share
  collection_factor: 2.5
  # 切り出しで残す出現の数の倍率。ほかの管理対象の語を含む窓などを除くと、語によっては出現の2〜3割
  # しか候補に残らないので、その分を見込む（候補が足りなくて止まったときは、大きくする）
  occurrence_margin: 5
  # 切り出しで、Pile の断片ごとに残す出現の鍵の上限を決める余裕（Pile 全体での見積もりで、残す数の
  # この倍の出現が入る上限にする。語の出現が見積もりより少なくて止まったときは、大きくする）
  key_limit_margin: 3
  # LLM の判定の精度（合格とした用例のうち、人も 1 とした割合）の、語ごとの下限
  # （試行だけ 0.85。curtain・arcane・bunk・cot・trailer・viper を含めて流すため。ユーザーの選択、11/7。
  #   本番の前に、この6語を入れ替えて 0.95 に戻す）
  minimum_judgment_precision: 0.85
  # 確認した 20 件で精度が下限に届かないが、この数を足せば 0 の数が許される数に収まる語に、足して
  # 確かめる用例の数（20 件で 0 が 2〜3 件の語は、60 件で 0 が 3 件以下なら合格）
  additional_reviewed_passages_per_word: 40

# 未知語の獲得
unknown_word_acquisition:
  # 露出回数（1 run の学習データに差し込む、1つの未知語の用例の数）の8つの水準
  # （試行だけ、いちばん上を 9900 にする。butter の置き換えられる用例が 9,984 件で、10,000 件に届かないため）
  exposure_levels: [0, 1, 10, 100, 1000, 3000, 5000, 9900]

# 語義の追加
sense_addition:
  # K: 足す語義1つあたりに、1 run の学習データに差し込む用例の数（暫定。未知語の獲得の結果で決める）
  # （試行だけ 1000。基データを小さくした試行で、結果を早く出すため。ユーザーの選択、11/7）
  passages_per_added_sense: 1000

# 2つ目の語義の追加（未知語の獲得で統合まで済んだ未知語に、別の名詞の語義を足す）
second_sense_addition:
  # 2つ目の語義を足す未知語の、1つ目の露出回数の下限（1B の試行では、統合は露出 269 回で半分まで
  # 進んだ。下限以上の水準は 1000・3000・5000・10000 の4つで、run ごとに 36 個）
  minimum_first_exposure: 1000
  # 2つ目の露出回数の水準（0 は、2つ目の語義を足さず、1つ目の語義の用例も入れない対照）
  second_exposure_levels: [0, 10, 100, 1000]

# 評価データ
evaluation:
  # 自然な語（実験で操作しない実在語）ごとの、課題の例やプローブの学習に使う文の数
  sentences_per_natural_word: 20
  # 自然な語ごとの、判定に合格させる用例の数（文を取り出せない用例を見込み、文の数より多くする）
  passages_per_natural_word: 40
  # 実在語らしさのプローブの、トークン数（1・2・3）ごとの実在語の数（2・3トークンの非語は、
  # この実在語のトークンを入れ替えて作る）
  probe_words_per_token_count: 100
  # 未知語の指標の正規化の基準にする、トークン数（2・3）ごとの既知の名詞の数
  normalization_nouns_per_token_count: 30
  # 課題の問題の前に見せる例の数（暫定。自然な語での正解率を見て決める）
  number_of_task_examples: 3
  # 言い換えの語が見つからないターゲット語があっても、課題の問題を作って続けるか（試行用。その語には、
  # 元の語義を問う問題を作らない）。false なら止まる
  # （試行だけ true。coupe・sailboat・recliner に言い換えの語がないため。本番の前に、この3語も入れ替える）
  allow_targets_without_paraphrase: true
  # （試行だけ true、1B だけで確かめる。LLM のサーバを学習のために止めていて、最小対を作り直せないため）
  allow_sense_pairs_without_minimal_pairs: true
  # 語義の組（ターゲット語の元の語義と、足す語義）ごとの最小対の数（暫定）と、
  # LLM に作らせる候補の数の、最小対の数に対する倍率（学習前のモデルでの確認で落ちる分を見込む）
  minimal_pairs_per_sense_pair: 20
  # （2 では、sailboat/jet の答えが1組だけで、2つの手がかりが同じ語だったので、3 にした。
  # LLM の判定（judge-minimal-pairs）でも落ちるので、6 にした。1B の試行では、見本の確認に
  # 通ったのは 31%）
  minimal_pair_candidate_factor: 6
  # 中立文脈（語の意味を示さない文の書き出し。直後に語を置く）の候補。前から順に、条件に合うものを使う。
  # 前の20種は設計書の付録Eの候補、後の30種は、足りないときに使う同じ形の文
  neutral_context_candidates:
    - Do you know about the
    - I heard something about the
    - Let me tell you about the
    - She asked me about the
    - We talked about the
    - He wrote a short note about the
    - They were thinking about the
    - I read an article about the
    - Have you ever heard of the
    - Nobody mentioned the
    - Here is some information about the
    - I want to learn more about the
    - There was a question about the
    - My friend told me about the
    - Can you explain the
    - I forgot about the
    - Someone asked about the
    - This is a story about the
    - Everyone was curious about the
    - I have never thought about the
    - I was reading about the
    - We were discussing the
    - He asked a question about the
    - They told us about the
    - I just learned about the
    - She was talking about the
    - Did you hear about the
    - There is a lot to say about the
    - I wanted to ask about the
    - We need to talk about the
    - I came across something about the
    - There was a lot of talk about the
    - We had a long conversation about the
    - He mentioned something about the
    - She wrote about the
    - They kept talking about the
    - I keep thinking about the
    - Tell me more about the
    - I saw a report about the
    - There is a new book about the
    - Nobody knew much about the
    - We learned something new about the
    - I asked my teacher about the
    - They had some questions about the
    - I found a page about the
    - Have you read anything about the
    - She gave a talk about the
    - There was a long discussion about the
    - I remember hearing about the
    - We wrote a report on the
  # 使う中立文脈の数（文脈なしを除く）
  number_of_neutral_contexts: 20
  # 中立文脈の条件: 自然な名詞の対数確率のカテゴリごとの平均（全カテゴリの平均との差）が、
  # 全候補での平均から、どのカテゴリでもこれ（自然対数）より離れない
  maximum_neutral_context_deviation: 0.5

# 継続事前学習（全ての run で共通）
training:
  # モデルごとの学習率（暫定: 事前学習のステージ1の最後の学習率。ピークの学習率と、余弦で下げる
  # 学習率の式から求めた値）
  learning_rate_by_model:
    OLMo-2-0425-1B: 7.4e-5
    OLMo-2-1124-7B: 6.1e-5
    OLMo-2-1124-13B: 3.0e-5
  # 1 step で学習するトークン数（4,096トークンの系列 × 256。暫定）
  batch_size_in_tokens: 1048576
  sequence_length: 4096
  # 学習データに使う、基データの先頭からの系列の数（試行で学習を小さくするとき。null なら全て）
  # （試行だけ 5,632 系列（約 2,300 万トークン）。1/16 の 4,608 系列では、未知語の獲得の用例が入らないため）
  number_of_base_sequences_used: 5632
  # 学習率を0から上げる step の、全ての step に対する割合（暫定）
  warmup_fraction: 0.01
  # モデルごとの、1つの GPU で1回に計算する系列の数（GPU のメモリに合わせる）
  sequences_per_device_by_model:
    OLMo-2-0425-1B: 4
    OLMo-2-1124-7B: 2
    OLMo-2-1124-13B: 1
  # モデルごとに、逆伝播のときに順伝播を計算し直して、GPU のメモリを節約するか（計算は約1.3倍に
  # なる。値は変わらない）。1B は、計算し直さなくても GPU のメモリに収まる
  gradient_checkpointing_by_model:
    OLMo-2-0425-1B: false
    OLMo-2-1124-7B: true
    OLMo-2-1124-13B: true
  # 最適化器 AdamW の設定（事前学習と同じ）
  optimizer_betas: [0.9, 0.95]
  optimizer_epsilon: 1.0e-8
  weight_decay: 0.1
  # 勾配のノルムの上限（事前学習と同じ）
  gradient_clipping: 1.0
  # z-loss（出力の対数の分配関数が大きくなりすぎないようにする損失）の重み（事前学習と同じ）
  z_loss_weight: 1.0e-5
  # 途中の重みを保存する、学習の進み具合（最後の重みは必ず保存する。暫定）
  checkpoint_fractions: [0.25, 0.5, 0.75]
  # 保存する重みの数値の型（bfloat16 は float32 の半分の大きさ。60 run × 4回で約3.6TB）
  checkpoint_number_type: bfloat16
  # 1トークンの未知語の埋め込みの初期値: 既存の埋め込みの平均 + 乱数（暫定）
  new_token_embedding_initialization:
    # 乱数の標準偏差の、既存の埋め込みの次元ごとの標準偏差に対する倍率
    noise_scale: 0.1
  # 学習の記録を送る W&B のプロジェクト
  weights_and_biases_project: lexical-acquisition-mechanisms-trial
