# 実験の設定。各コマンドは、リポジトリの最上位のディレクトリにあるこのファイルを読む。

# --model で指定する名前と、Hugging Face のリポジトリ・版（コミット）。
# 版は、事前学習のステージ1の最後の重み（継続事前学習の学習率と学習データを、ステージ1に合わせるため）。
# コメントは、そのコミットを指すブランチの名前
models:
  OLMo-2-0425-1B:
    repository: allenai/OLMo-2-0425-1B
    revision: 9d3e43659f00c17e6da23cf32333afd1fc39fa1a  # stage1-step1907359-tokens4001B
  OLMo-2-1124-7B:
    repository: allenai/OLMo-2-1124-7B
    revision: c0371f4281bf2376207646c6b62ddc6c442c7577  # stage1-step928646-tokens3896B
  OLMo-2-1124-13B:
    repository: allenai/OLMo-2-1124-13B
    revision: 08d2aca2e28ab67ad859793f76ef5c923e94ac11  # stage1-step596057-tokens5001B

# 語の候補の生成や用例の判定に使う LLM（README のとおりに起動した vLLM のサーバ）
llm:
  server_url: http://localhost:8000/v1
  model: Qwen/Qwen3-Next-80B-A3B-Instruct-FP8
  maximum_concurrent_requests: 128

# 基データ（OLMo 2 の事前学習データの、学習順で先頭の部分）と検証データ
base_data:
  # OLMo 2 7B のステージ1の学習設定（版を固定した URL）。3モデルとも、学習データの一覧と seed は同じ
  pretraining_configuration_url: https://raw.githubusercontent.com/allenai/OLMo/090253dac6688f2532509daa7aa2eb5fae50e956/configs/official-1124/OLMo2-7B-stage1.yaml
  # 学習順の先頭から取る系列（4,096トークン）の数。7B の事前学習の最初の72 step 分（約3億トークン）
  number_of_base_sequences: 73728
  # その直後から取る、検証データの系列の数（約1,000万トークン）
  number_of_validation_sequences: 2442

# 語の選定
words:
  # 名詞のカテゴリ。name は課題2の選択肢の語にもなる（先頭スペース付きで1トークンの語）。
  # wordnet_roots の synset の下にある語義を、そのカテゴリの語義とする
  categories:
    - name: food
      description: foods and dishes that people eat
      wordnet_roots: [food.n.01, food.n.02]
    - name: animal
      description: animals
      wordnet_roots: [animal.n.01]
    - name: vehicle
      description: vehicles that carry people or goods
      wordnet_roots: [vehicle.n.01]
    - name: clothing
      description: clothing and footwear worn on the body
      wordnet_roots: [clothing.n.01, footwear.n.02]
    - name: furniture
      description: furniture and home furnishings
      wordnet_roots: [furnishing.n.02]
    - name: building
      description: buildings
      wordnet_roots: [building.n.01]
  # LLM に語を挙げさせるときの、挙げる語の種類（種類ごとに1回）と、1回に挙げさせる数
  listing_kinds:
    - very common, everyday
    - less common but well-known
  nouns_per_listing: 200
  adjectives_per_listing: 400
  # 頻度と使われ方を見積もるときに読む、Pile の先頭の断片の数（全1,650個のうち約3%）
  pile_sample_shards: 50
  # 使われ方を LLM が判定する、語ごとの見本の数
  usage_examples_per_word: 50
  seed: 0

# 未知語（モデルが見たことのない文字列）の候補
unknown_words:
  # 一度も現れないことを確かめる infini-gram の索引（OLMo 2 13B の中間学習・事後学習までの学習データと、Pile）
  corpus_indexes:
    - v4_olmo-2-1124-13b-instruct_llama
    - v4_piletrain_llama
  # ARC 非語データベースの、同音の実在語がない非語（Rastle et al., 2002。figshare で公開）
  arc_nonwords_url: https://ndownloader.figshare.com/files/13877978
  # トークン数（2・3）と綴りの近さ（near・far）の組ごとに集める、一度も現れない候補の数
  # （使うのは各12個。最初のトークンが重ならないように選ぶための余裕を持たせる）
  candidates_per_group: 40

# 候補から語を選ぶときの条件（words select）
word_selection:
  # Pile の見本で、意図した語義（形容詞は、形容詞として）で使われていた割合の下限
  minimum_usage_share: 0.9
  # その割合を当てにできるように、LLM が判定できた見本の数の下限
  minimum_judged_usages: 20
  # Pile で取れる用例の見積もりに、意図した使われ方の割合を掛けた数が、必要な数の何倍以上か
  # （ほぼ同じ用例の除去と、ほかの管理対象の語を含む用例の除外で減る分を見込む）
  passage_margin: 2.0

# 用例（管理対象の語を含む、Pile から切り出した文章）
passages:
  # 用例の長さ（トークン数）
  tokens_per_passage: 256
  # 1つの文書から取る用例の数の上限
  maximum_passages_per_document: 3
  # 語ごとの評価用の用例の数
  evaluation_passages_per_word: 500

# 未知語の獲得
unknown_word_acquisition:
  # 露出回数（1 run の学習データに差し込む、1つの未知語の用例の数）の8つの水準
  exposure_levels: [0, 1, 10, 100, 1000, 3000, 5000, 10000]
